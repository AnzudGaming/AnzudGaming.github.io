<body>

    <button id="clearBtn" disabled><i class="fas fa-trash"></i> Eliminar</button>
    <div class="status"></div>
  </div>

  <div id="preview">
    <p style="color: white; text-align: center; margin:0;">Preview</p>
  </div>

  <script>
    var fileInput = document.querySelector('#fileInput');
    var uploadBtn = document.querySelector('#uploadBtn');
    var clearBtn = document.querySelector('#clearBtn');
    var preview = document.querySelector('#preview');
    var socket = io();

    // FUNCION PARA MOSTRAR EL ARCHIVO EN LA VISTA PREVIA
    function mostrarPreiew(file) {
      const fileURL = URL.createObjectURL(file);
      const fileType = file.type.split('/')[0];

      // LIMPIAMOS EL CONTENIDO PREVIO
      preview.innerHTML = '';

      // MOSTRAMOS LA IMAGEN O VIDEO EN LA VISTA PREVIA
      if (fileType === 'image') {
        const img = document.createElement('img');
        img.src = fileURL;
        preview.appendChild(img);
      } else if (fileType === 'video') {
        const video = document.createElement('video');
        video.src = fileURL;
        video.controls = true;
        video.autoplay = false;
        preview.appendChild(video);

        // SINCRONIZAMOS LA REPRODUCCION Y PAUSA ENTRE SERVIDOR Y CLIENTE
        video.addEventListener('play', () => {
          setTimeout(() => {
            socket.emit('sync', { action: 'play' });
          }, 100);
        });
        video.addEventListener('pause', () => socket.emit('sync', { action: 'pause' }));
        video.addEventListener('seeked', () => {
          socket.emit('sync', { action: 'seek', time: video.currentTime });
        });

        // ESCUCHAMOS LOS EVENTEOS DESDE EL SERVIDOR
        socket.off('sync');
        socket.on('sync', (data) => {
          const video = preview.querySelector('video');
          if (data.action === 'play') {
            video.play();
          }
          if (data.action === 'pause') {
            video.pause();
          }
          if (data.action === 'seek') {
            video.currentTime = data.time;
          }
        })
      }
    }



    // MUESTRA EL MENSAJE DE ESTADO
    function publicarMensaje(msg) {
      document.querySelector('.status').innerText = msg;
    }

    // HABILITAR/DESHABILITAR BOTONES
    fileInput.addEventListener('change', () => {
      uploadBtn.disabled = !fileInput.files.length;
      if (fileInput.files.length) {
        mostrarPreiew(fileInput.files[0]);
      }
    });

    // FUNCION PARA ENVIAR EL ARCHIVO AL SERVIDOR
    function uploadFile(file) {
      var reader = new FileReader();

      reader.onload = function (e) {
        socket.emit('file', e.target.result);
        clearBtn.disabled = false;
        publicarMensaje('Archivo subido con éxito.');
      }

      reader.onerror = function (err) {
        publicarMensaje('Ocurrió un error al subir el archivo: ' + err);
      }

      reader.readAsDataURL(file);
    }

    // EVENTO DE CLIC EN EL BOTON PARA SUBIR EL ARCHIVO
    uploadBtn.addEventListener('click', () => {
      var file = fileInput.files[0];
      if (file) {
        publicarMensaje('Subiendo archivo...');
        uploadFile(file);
      } else {
        publicarMensaje('Por favor, seleccione un archivo');
      }
    });

    clearBtn.addEventListener('click', () => {
      socket.emit('clear');
      publicarMensaje('Contenido eliminado.');
      clearBtn.disabled = true;
      uploadBtn.disabled = true;
      fileInput.value = '';
      preview.innerHTML = '<p style="color: white; text-align: center; margin:0;">Preview</p>'
    });

    socket.on('clear', () => {
      clearBtn.disabled = true;
    });
  </script>

</body>

</html>
