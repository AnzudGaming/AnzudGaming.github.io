<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servidor</title>
  <script src="/socket.io/socket.io.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"> <!-- Iconos -->
  <style>
    /* General Reset */
    body {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
      background-color: #f9f9f9;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    /* File Input Label */
    .label-file {
      display: inline-block;
      background-color: #3498db;
      color: white;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
      margin-right: 10px;
      transition: background-color 0.3s ease;
    }

    .label-file:hover {
      background-color: #2980b9;
    }

    /* Buttons */
    button {
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button i {
      margin-right: 8px;
    }

    /* Upload Button */
    #uploadBtn {
      background-color: #2ecc71;
      color: white;
    }

    #uploadBtn:hover {
      background-color: #27ae60;
    }

    /* Clear Button */
    #clearBtn {
      background-color: #e74c3c;
      color: white;
      margin-left: 10px;
    }

    #clearBtn:hover {
      background-color: #c0392b;
    }

    button:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }

    /* Status Message */
    .status {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #34495e;
    }

    img,
    video {
      max-width: 100%;
      margin-top: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .mt-20 {
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1><i class="fas fa-cloud-upload-alt"></i> Subir y Visualizar Archivos</h1>
    <label for="fileInput" class="label-file"><i class="fas fa-file-upload"></i> Seleccionar archivo</label>
    <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;">
    <button id="uploadBtn" disabled><i class="fas fa-upload"></i> Subir</button>
    <button id="clearBtn" disabled><i class="fas fa-trash"></i> Eliminar</button>
    <div class="status"></div>
  </div>

  <script>
    const fileInput = document.querySelector('#fileInput');
    const uploadBtn = document.querySelector('#uploadBtn');
    const clearBtn = document.querySelector('#clearBtn');
    const statusDiv = document.querySelector('.status');
    const socket = io();

    // Habilitar botón al seleccionar un archivo
    fileInput.addEventListener('change', () => {
      uploadBtn.disabled = !fileInput.files.length;
      statusDiv.textContent = ''; // Limpiar mensaje
    });

    // Subir archivo
    uploadBtn.addEventListener('click', () => {
      const file = fileInput.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          socket.emit('file', e.target.result); // Enviar archivo
          statusDiv.textContent = 'Archivo subido con éxito.';
          statusDiv.style.color = '#2ecc71';
          clearBtn.disabled = false;
        };
        reader.onerror = () => {
          statusDiv.textContent = 'Error al subir el archivo.';
          statusDiv.style.color = '#e74c3c';
        };
        reader.readAsDataURL(file);
      }
    });

    // Eliminar archivo
    clearBtn.addEventListener('click', () => {
      socket.emit('clear');
      statusDiv.textContent = 'Contenido eliminado.';
      statusDiv.style.color = '#e74c3c';
      clearBtn.disabled = true;
    });

    // Actualizar estado desde el servidor
    socket.on('clear', () => {
      clearBtn.disabled = true;
    });
  </script>
</body>

</html>
